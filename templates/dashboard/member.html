{% extends "base.html" %}

{% block title %}Projects you’ve joined | Milify{% endblock %}

{% block content %}
    <main class="workspace">
        <div class="page-heading">
            <div>
                <h1 id="dashboard-title">Member workspace</h1>
                <p class="intro">Find a project to join and collaborate with its team.</p>
            </div>
        </div>
        <section class="panel empty-state" aria-labelledby="projects-title">
            <h2 class="panel-heading" id="projects-title">Join a project</h2>
            <p>Enter a project invite or browse available projects to get started.</p>
            <a class="button-link" href="{% url 'member_join_project' %}">Join project</a>
        </section>
    </main>
{% endblock %}
