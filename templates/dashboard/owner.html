{% extends "base.html" %}

{% block title %}Projects you own | Milify{% endblock %}

{% block content %}
    <main class="workspace">
        <div class="page-heading">
            <div>
                <h1 id="dashboard-title">Owner workspace</h1>
                <p class="intro">Create and manage your projects from one place.</p>
            </div>
        </div>
        <section class="panel empty-state" aria-labelledby="projects-title">
            <h2 class="panel-heading" id="projects-title">Start a project</h2>
            <p>Create a project to organize your work and invite members.</p>
            <a class="button-link" href="{% url 'owner_create_project' %}">Create project</a>
        </section>
    </main>
{% endblock %}
