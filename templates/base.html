<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% load static %}
    <meta name="theme-color" content="#173d31">
    <title>{% block title %}Milify{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--ink);
            background: var(--canvas);
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            /* Mineral paper, deep spruce, and persimmon form Milify's field-notes identity. */
            --ink: #20332b;
            --muted: #5b6960;
            --line: #d7dfd5;
            --paper: #fffdf7;
            --canvas: #f5f2e9;
            --green: #176348;
            --green-dark: #124a37;
            --green-pale: #e3eee7;
            --persimmon: #b64b32;
            --persimmon-pale: #f8e5db;
            --error: #a33d33;
            --success: #315c42;
            --radius: 14px;
        }
        * { box-sizing: border-box; }
        body { min-width: 320px; min-height: 100svh; margin: 0; font-size: 15px; line-height: 1.55; }
        a { color: var(--green); text-underline-offset: 3px; }
        a:hover { color: var(--green-dark); }
        button, input { font: inherit; }
        :focus-visible { outline: 3px solid var(--persimmon); outline-offset: 3px; }
        ::selection { color: #382019; background: #efc8b3; }
        .site-header { position: relative; z-index: 1; height: 76px; display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(20px, 5vw, 72px); background: #173d31; border-bottom: 3px solid #cf7253; }
        .brand { display: inline-flex; align-items: center; gap: 10px; color: #fffdf7; font-size: 19px; font-weight: 750; letter-spacing: -.045em; text-decoration: none; }
        .brand-logo { display: block; width: 50px; height: 50px; border: 1px solid #b8c8b4; border-radius: 10px; background: #f4f0e7; object-fit: contain; }
        .navigation { display: flex; align-items: center; gap: 22px; }
        .navigation a, .navigation button { color: #e4e9df; font-size: 14px; font-weight: 600; text-decoration: none; }
        .navigation a { padding: 8px 11px; border-radius: 7px; }
        .navigation a:hover, .navigation button:hover { color: #fffdf7; }
        .navigation a:hover { background: #285646; }
        .navigation a:focus-visible, .navigation button:focus-visible { outline-color: #f0a37e; }
        .navigation form { margin: 0; }
        .navigation button { padding: 0; border: 0; background: transparent; cursor: pointer; }
        .user-chip { padding: 7px 11px; border: 1px solid #557264; border-radius: 999px; background: #285646; color: #f5f2e9; font-size: 13px; }
        .workspace { position: relative; width: min(100% - 48px, 1120px); margin: 0 auto; padding: 64px 0 92px; }
        .workspace::before { position: absolute; z-index: -1; top: 37px; right: -42px; width: 165px; height: 165px; border: 1px solid #d8d3c4; border-radius: 50%; content: ""; opacity: .62; }
        .page-heading { display: flex; min-height: 144px; justify-content: space-between; align-items: center; gap: 24px; margin-bottom: 35px; padding: 24px 34px; border-radius: 17px; background: #e8ede2; box-shadow: inset 5px 0 #b64b32; }
        h1, h2, p { margin-top: 0; }
        h1 { margin-bottom: 9px; font-size: clamp(32px, 4.2vw, 46px); line-height: 1.06; letter-spacing: -.052em; font-weight: 720; }
        h2 { font-size: 19px; line-height: 1.3; letter-spacing: -.025em; }
        .intro { max-width: 65ch; margin: 0; color: var(--muted); font-size: 16px; }
        .panel { padding: 28px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); box-shadow: 0 12px 32px #21392b0d; }
        .panel-heading { margin: 0 0 20px; }
        .project-list { margin: 0; padding: 0; list-style: none; border-top: 2px solid var(--green); }
        .project-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 20px; padding: 22px 14px; border-bottom: 1px solid var(--line); transition: background .16s ease; }
        .project-item:hover { background: #f3f3e9; }
        .project-item:last-child { border-bottom: 0; }
        .project-item h2 { margin: 0 0 5px; color: var(--green-dark); }
        .project-description { max-width: 68ch; margin: 0; color: var(--muted); overflow-wrap: anywhere; }
        .project-date { margin: 3px 0 0; color: var(--muted); font-size: 13px; white-space: nowrap; }
        .empty-state { padding: 28px 4px 8px; color: var(--muted); }
        .empty-state p { margin-bottom: 0; }
        .dashboard-choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-top: 30px; }
        .choice { position: relative; display: flex; min-height: 225px; flex-direction: column; align-items: flex-start; justify-content: flex-end; overflow: hidden; padding: 30px; border: 1px solid #d6ded4; border-radius: var(--radius); background: var(--paper); color: var(--ink); text-decoration: none; transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease; }
        .choice::before { position: absolute; top: -50px; right: -34px; width: 180px; height: 180px; border: 24px solid #e3eee7; border-radius: 50%; content: ""; }
        .choice::after { position: absolute; top: 21px; right: 32px; width: 48px; height: 48px; border-radius: 50%; background: #f8e5db; content: ""; }
        .choice:hover { transform: translateY(-4px); border-color: var(--green); box-shadow: 0 16px 30px #20332b1a; color: var(--ink); }
        .choice h2 { position: relative; margin: 0 0 7px; font-size: 23px; }
        .choice p { margin: 0; color: var(--muted); }
        .choice-arrow { display: block; margin-top: 18px; color: var(--persimmon); font-size: 14px; font-weight: 700; }
        .switch-link { display: inline-block; margin-top: 24px; font-size: 14px; font-weight: 620; }
        .profile-grid { display: grid; grid-template-columns: minmax(220px, .8fr) minmax(0, 1.2fr); gap: 20px; align-items: start; }
        .profile-details { margin: 0; }
        .profile-details div { padding: 15px 0; border-bottom: 1px solid var(--line); }
        .profile-details div:first-child { padding-top: 0; }
        .profile-details div:last-child { border-bottom: 0; }
        .profile-details dt { margin-bottom: 4px; color: var(--muted); font-size: 13px; }
        .profile-details dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
        .form-panel h2 { margin-bottom: 20px; }
        .field { margin-bottom: 18px; }
        label { display: block; margin-bottom: 7px; color: #343a31; font-size: 14px; font-weight: 620; }
        input:not([type="hidden"]) { width: 100%; min-height: 46px; padding: 10px 13px; border: 1px solid #c7c1b5; border-radius: 8px; background: var(--paper); color: var(--ink); }
        input::placeholder { color: var(--muted); }
        input:focus { border-color: var(--persimmon); outline: 3px solid #f1d5c5; }
        .help, .help ul { margin: 7px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; line-height: 1.55; }
        .error, .errorlist { margin: 7px 0 0; padding: 0; color: var(--error); font-size: 13px; line-height: 1.45; list-style: none; }
        .message { margin: 0 0 20px; padding: 12px 14px; border: 1px solid #c4d2bd; border-radius: 9px; background: var(--green-pale); color: var(--success); font-size: 14px; }
        .message.error { border-color: #e2bcb0; background: var(--persimmon-pale); color: var(--error); }
        .submit, .button-link { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; padding: 0 18px; border: 1px solid var(--green); border-radius: 8px; background: var(--green); color: white; font-weight: 650; text-decoration: none; cursor: pointer; transition: background .16s ease, transform .16s ease; }
        .submit:hover, .button-link:hover { transform: translateY(-1px); border-color: var(--green-dark); background: var(--green-dark); color: white; }
        .submit:disabled { opacity: .62; cursor: wait; transform: none; }
        .account-layout { display: grid; min-height: 100svh; grid-template-columns: minmax(300px, .9fr) minmax(0, 1.1fr); background: var(--canvas); }
        .account-aside { position: relative; display: flex; min-height: 600px; flex-direction: column; justify-content: space-between; overflow: hidden; padding: clamp(34px, 7vw, 86px); background: #173d31; color: #f4f0e7; }
        .account-aside::after { position: absolute; right: -90px; bottom: 42px; width: clamp(270px, 35vw, 470px); aspect-ratio: 1; border: 1px solid #76927c; border-radius: 50%; box-shadow: 0 0 0 32px #ffffff09, 0 0 0 74px #ffffff08, 0 0 0 120px #ffffff06; content: ""; pointer-events: none; }
        .account-aside .brand { color: white; }
        .account-aside-copy { position: relative; z-index: 1; max-width: 440px; margin: auto 0; padding: 45px 0; }
        .account-aside-copy h1 { max-width: 13ch; font-size: clamp(36px, 4.6vw, 56px); line-height: 1.06; letter-spacing: -.055em; }
        .account-aside-copy p { max-width: 38ch; margin: 0; color: #dce2d6; font-size: 16px; }
        .aside-foot { margin: 0; color: #cfd8c8; font-size: 13px; }
        .account-main { display: flex; align-items: center; justify-content: center; padding: 48px 34px; }
        .account-form { width: min(100%, 460px); padding: 38px; border: 1px solid var(--line); border-radius: 17px; background: var(--paper); box-shadow: 0 18px 50px #20332b12; }
        .register-form { width: min(100%, 590px); padding: 44px; }
        .account-form h2 { margin: 0 0 8px; font-size: 30px; letter-spacing: -.04em; }
        .account-form .intro { margin-bottom: 28px; }
        .account-form .submit { width: 100%; margin-top: 3px; }
        .account-footer { margin: 22px 0 0; color: var(--muted); text-align: center; font-size: 14px; }
        .account-footer a { font-weight: 650; }
        @media (max-width: 760px) {
            .site-header { height: auto; min-height: 68px; padding: 11px 20px; }
            .navigation { gap: 14px; }
            .user-chip { display: none; }
            .workspace { width: min(100% - 32px, 620px); padding-top: 38px; }
            .workspace::before { right: -8px; width: 100px; height: 100px; }
            .page-heading { min-height: 125px; padding: 22px 25px; }
            .profile-grid { grid-template-columns: 1fr; }
            .account-layout { grid-template-columns: 1fr; }
            .account-aside { min-height: 270px; padding: 25px 28px; }
            .account-aside-copy { padding: 36px 0; }
            .account-aside-copy h1 { max-width: 16ch; font-size: 38px; }
            .aside-foot { display: none; }
            .account-main { padding: 38px 24px 54px; }
            .register-form { width: min(100%, 590px); padding: 32px; }
        }
        @media (max-width: 520px) {
            .brand { font-size: 17px; }
            .brand-logo { width: 39px; height: 39px; }
            .navigation { gap: 12px; }
            .navigation a, .navigation button { font-size: 13px; }
            .workspace { width: min(100% - 28px, 480px); padding-top: 30px; }
            .page-heading { align-items: start; min-height: 118px; margin-bottom: 24px; padding: 20px; }
            h1 { font-size: 30px; }
            .dashboard-choices { grid-template-columns: 1fr; gap: 13px; margin-top: 22px; }
            .choice { min-height: 190px; padding: 23px; }
            .panel { padding: 20px 17px; }
            .project-item { grid-template-columns: 1fr; gap: 7px; padding: 18px 2px; }
            .project-date { white-space: normal; }
            .account-aside { min-height: 220px; padding: 21px 23px; }
            .account-aside-copy { padding: 28px 0 8px; }
            .account-aside-copy h1 { font-size: 34px; }
            .account-aside-copy p { font-size: 14px; }
            .account-main { padding: 32px 20px 44px; }
            .account-form, .register-form { padding: 26px 22px; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; } }
    </style>
</head>
<body>
    {% if user.is_authenticated %}
        <header class="site-header">
            <a class="brand" href="{% url 'dashboard' %}" aria-label="Milify home"><img class="brand-logo" src="{% static 'images/milify-logo.png' %}" alt="">Milify</a>
            <nav class="navigation" aria-label="Main navigation">
                <a href="{% url 'dashboard' %}">Workspace</a>
                <a href="{% url 'profile' %}">Profile</a>
                <span class="user-chip">{{ user.full_name|default:user.username }}</span>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit">Log out</button>
                </form>
            </nav>
        </header>
    {% endif %}
    {% block content %}{% endblock %}
    <script>
        document.querySelectorAll("form").forEach(function (form) {
            form.addEventListener("submit", function () {
                var button = form.querySelector("button[type='submit']");
                if (button && form.checkValidity()) {
                    button.disabled = true;
                    button.setAttribute("aria-busy", "true");
                }
            });
        });
    </script>
</body>
</html>
